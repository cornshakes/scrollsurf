services:
  app:
    image: scrollsurf-test
    ports:
      - "${TEST_PORT:-3001}:3000"
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ${DATA_DIR_HOST}:/data
    restart: unless-stopped
    # App logs JSON to stdout; Docker rotates the capture file (~50MB ceiling).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
