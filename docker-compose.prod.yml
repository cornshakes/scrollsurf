services:
  ts-scrollsurf:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-scrollsurf}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME:-scrollsurf}
      TS_EXTRA_ARGS: --advertise-tags=tag:scrollsurf
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      # The Pi runs a 6.18 kernel, which ships no legacy iptables backend
      # (no ip_tables.ko / iptable_filter.ko — only nf_tables). Without this,
      # tailscaled fails to build its filter table and Funnel TLS handshakes
      # are reset at the edge (browsers report PR_END_OF_FILE_ERROR).
      TS_DEBUG_FIREWALL_MODE: nftables
    volumes:
      - ts-state:/var/lib/tailscale
      - ${DATA_DIR_HOST}/serve.json:/config/serve.json:ro
    cap_add:
      - net_admin
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

  app:
    image: scrollsurf-prod
    network_mode: service:ts-scrollsurf
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ${DATA_DIR_HOST}:/data
    depends_on:
      - ts-scrollsurf
    restart: unless-stopped
    # App logs JSON to stdout; Docker rotates the capture file (~50MB ceiling) so the
    # Pi's disk can't fill up. `pi:logs:prod` reads across the rotated set transparently.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  ts-state:
