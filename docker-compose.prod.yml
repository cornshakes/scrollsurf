services:
  ts-scrollsurf:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-scrollsurf}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME:-scrollsurf}
      TS_EXTRA_ARGS: --advertise-tags=tag:scrollsurf
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    volumes:
      - ts-state:/var/lib/tailscale
      - ${DATA_DIR_HOST}/serve.json:/config/serve.json:ro
    cap_add:
      - net_admin
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

  app:
    build: .
    network_mode: service:ts-scrollsurf
    volumes:
      - ${DATA_DIR_HOST}:/data
    depends_on:
      - ts-scrollsurf
    restart: unless-stopped

volumes:
  ts-state:
