services:
  app:
    image: scrollsurf-prod
    # The proxy's reverse_proxy target. Compose's generated DNS name would be
    # ambiguous on a network shared with other projects, so pin it.
    container_name: scrollsurf-app
    expose: ["3000"]
    # Naming any network turns off the implicit default one, so `default` has to
    # be listed too or the app silently loses the network it already had.
    networks: [default, caddy_net]
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ${DATA_DIR_HOST}:/data
    restart: unless-stopped
    # App logs JSON to stdout; Docker rotates the capture file (~50MB ceiling) so the
    # host's disk can't fill up. `logs:prod` reads across the rotated set transparently.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # Created once on the box by hand: docker network create caddy_net
  caddy_net:
    external: true
