<svg xmlns="http://www.w3.org/2000/svg" width="920" height="416" viewBox="0 0 920 416" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="919" height="415" fill="#ffffff" stroke="#e2e8f0" rx="8"/>
  <text x="20" y="34" font-size="16" font-weight="600" fill="#0f172a">From Wikipedia to the runtime database</text>

  <!-- APIs -->
  <rect x="20" y="160" width="160" height="96" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="100" y="190" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Wikipedia</text>
  <text x="100" y="208" font-size="12.5" fill="#334155" text-anchor="middle">Wikimedia Commons</text>
  <text x="100" y="226" font-size="12.5" fill="#334155" text-anchor="middle">Wikiquote</text>
  <text x="100" y="245" font-size="11" fill="#64748b" text-anchor="middle">public APIs</text>

  <line x1="182" y1="208" x2="218" y2="208" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Download scripts -->
  <rect x="222" y="160" width="170" height="96" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="307" y="194" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">Download scripts</text>
  <text x="307" y="214" font-size="12" fill="#1e40af" text-anchor="middle">one per dataset</text>
  <text x="307" y="232" font-size="12" fill="#1e40af" text-anchor="middle">run offline &#183; resumable</text>

  <line x1="394" y1="208" x2="434" y2="208" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Reference DBs -->
  <rect x="438" y="64" width="202" height="316" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="539" y="88" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Reference databases</text>
  <text x="539" y="104" font-size="11" fill="#64748b" text-anchor="middle">one file per dataset</text>

  <rect x="450" y="116" width="178" height="26" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="539" y="133" font-size="12" fill="#1e40af" text-anchor="middle">Vital articles (~48,000)</text>
  <rect x="450" y="148" width="178" height="26" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="539" y="165" font-size="12" fill="#1e40af" text-anchor="middle">Unusual articles</text>
  <rect x="450" y="180" width="178" height="26" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="539" y="197" font-size="12" fill="#1e40af" text-anchor="middle">Good articles</text>
  <rect x="450" y="212" width="178" height="26" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="539" y="229" font-size="12" fill="#1e40af" text-anchor="middle">Featured articles</text>
  <rect x="450" y="244" width="178" height="26" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="539" y="261" font-size="12" fill="#166534" text-anchor="middle">Featured pictures</text>
  <rect x="450" y="276" width="178" height="26" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="539" y="293" font-size="12" fill="#166534" text-anchor="middle">Commons pictures</text>
  <rect x="450" y="308" width="178" height="26" rx="5" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="539" y="325" font-size="12" fill="#92400e" text-anchor="middle">Quotes of the Day</text>
  <rect x="450" y="340" width="178" height="26" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="539" y="357" font-size="12" fill="#334155" text-anchor="middle">Category map</text>

  <line x1="642" y1="208" x2="702" y2="208" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="673" y="196" font-size="10.5" fill="#64748b" text-anchor="middle">app startup</text>
  <text x="673" y="226" font-size="10.5" fill="#64748b" text-anchor="middle">copy new,</text>
  <text x="673" y="239" font-size="10.5" fill="#64748b" text-anchor="middle">skip known</text>

  <!-- Runtime DB -->
  <rect x="706" y="64" width="194" height="316" rx="8" fill="#faf5ff" stroke="#c084fc"/>
  <text x="803" y="88" font-size="13" font-weight="600" fill="#6b21a8" text-anchor="middle">scrollsurf.db</text>
  <text x="803" y="104" font-size="11" fill="#7c3aed" text-anchor="middle">the only DB the app reads</text>

  <rect x="718" y="118" width="170" height="56" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="803" y="139" font-size="12" font-weight="600" fill="#6b21a8" text-anchor="middle">items</text>
  <text x="803" y="156" font-size="11" fill="#6b21a8" text-anchor="middle">one row per article,</text>
  <text x="803" y="169" font-size="11" fill="#6b21a8" text-anchor="middle">picture or quote</text>

  <rect x="718" y="184" width="170" height="52" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="803" y="205" font-size="12" font-weight="600" fill="#6b21a8" text-anchor="middle">details per type</text>
  <text x="803" y="223" font-size="11" fill="#6b21a8" text-anchor="middle">text, images, authors, &#8230;</text>

  <rect x="718" y="246" width="170" height="52" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="803" y="267" font-size="12" font-weight="600" fill="#6b21a8" text-anchor="middle">topics</text>
  <text x="803" y="285" font-size="11" fill="#6b21a8" text-anchor="middle">tagged with their dataset</text>

  <rect x="718" y="308" width="170" height="40" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="803" y="333" font-size="12" font-weight="600" fill="#6b21a8" text-anchor="middle">categories</text>

  <text x="20" y="404" font-size="11.5" fill="#64748b" font-style="italic">Datasets are download-once: if a download shipped bad data, delete that reference file and re-download &#8212; the runtime DB simply re-imports on the next start.</text>
</svg>
