<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="919" height="399" fill="#ffffff" stroke="#e2e8f0" rx="8"/>
  <text x="20" y="34" font-size="16" font-weight="600" fill="#0f172a">Merging near-duplicate topics into buckets</text>
  <text x="330" y="72" font-size="11.5" fill="#64748b" text-anchor="middle">hand-maintained mapping</text>

  <!-- topic pills, cluster 1 -->
  <rect x="30" y="92" width="250" height="30" rx="15" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="155" y="111" font-size="12" fill="#334155" text-anchor="middle"><tspan font-weight="600">Vital</tspan> &#8741; Warfare</text>
  <rect x="30" y="132" width="250" height="30" rx="15" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="155" y="151" font-size="12" fill="#334155" text-anchor="middle"><tspan font-weight="600">Unusual</tspan> &#8741; Military</text>
  <rect x="30" y="172" width="250" height="30" rx="15" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="155" y="191" font-size="12" fill="#334155" text-anchor="middle"><tspan font-weight="600">Featured</tspan> &#8741; War and military</text>

  <!-- topic pills, cluster 2 -->
  <rect x="30" y="240" width="250" height="30" rx="15" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="155" y="259" font-size="12" fill="#334155" text-anchor="middle"><tspan font-weight="600">Vital</tspan> &#8741; Visual arts</text>
  <rect x="30" y="280" width="250" height="30" rx="15" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="155" y="299" font-size="12" fill="#334155" text-anchor="middle"><tspan font-weight="600">Good</tspan> &#8741; Art and architecture</text>
  <rect x="30" y="320" width="250" height="30" rx="15" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="155" y="339" font-size="12" fill="#334155" text-anchor="middle"><tspan font-weight="600">Pictures</tspan> &#8741; Artwork</text>

  <!-- converging arrows -->
  <line x1="284" y1="107" x2="466" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="284" y1="147" x2="466" y2="147" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="284" y1="187" x2="466" y2="154" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="284" y1="255" x2="466" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="284" y1="295" x2="466" y2="295" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="284" y1="335" x2="466" y2="302" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- buckets -->
  <rect x="470" y="118" width="170" height="58" rx="10" fill="#dcfce7" stroke="#4ade80"/>
  <text x="555" y="143" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">Military</text>
  <text x="555" y="162" font-size="11" fill="#166534" text-anchor="middle">bucket</text>
  <rect x="470" y="266" width="170" height="58" rx="10" fill="#dcfce7" stroke="#4ade80"/>
  <text x="555" y="291" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">Arts</text>
  <text x="555" y="310" font-size="11" fill="#166534" text-anchor="middle">bucket</text>

  <!-- notes -->
  <text x="672" y="120" font-size="12" fill="#475569">
    <tspan x="672" dy="0">&#8226; Every dataset brings its own topic</tspan>
    <tspan x="684" dy="16">names, so similar topics collide.</tspan>
    <tspan x="672" dy="28">&#8226; ~33 buckets cover every</tspan>
    <tspan x="684" dy="16">(dataset, topic) pair.</tspan>
    <tspan x="672" dy="28">&#8226; The app refuses to start if any</tspan>
    <tspan x="684" dy="16">pair is left unmapped.</tspan>
    <tspan x="672" dy="28">&#8226; Buckets are backend-only: cards</tspan>
    <tspan x="684" dy="16">show topics, only the feed&#8217;s</tspan>
    <tspan x="684" dy="16">affinity math sees buckets.</tspan>
  </text>

  <text x="20" y="384" font-size="11.5" fill="#64748b" font-style="italic">Topic and bucket names above are illustrative examples; an item can carry several topics and therefore sit in several buckets.</text>
</svg>
