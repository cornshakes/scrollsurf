<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="919" height="439" fill="#ffffff" stroke="#e2e8f0" rx="8"/>
  <text x="20" y="34" font-size="16" font-weight="600" fill="#0f172a">Building the feed index: bucket sets</text>
  <text x="410" y="64" font-size="11.5" fill="#64748b" text-anchor="middle">group items by their exact combination of buckets</text>

  <!-- item cards -->
  <g>
    <rect x="24" y="84" width="240" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="40" y="106" font-size="12.5" font-weight="600" fill="#0f172a">Article A</text>
    <rect x="40" y="116" width="62" height="19" rx="9.5" fill="#dcfce7" stroke="#86efac"/>
    <text x="71" y="129" font-size="11" fill="#166534" text-anchor="middle">History</text>
    <rect x="108" y="116" width="58" height="19" rx="9.5" fill="#dcfce7" stroke="#86efac"/>
    <text x="137" y="129" font-size="11" fill="#166534" text-anchor="middle">Places</text>
  </g>
  <g>
    <rect x="24" y="160" width="240" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="40" y="182" font-size="12.5" font-weight="600" fill="#0f172a">Article B</text>
    <rect x="40" y="192" width="62" height="19" rx="9.5" fill="#dcfce7" stroke="#86efac"/>
    <text x="71" y="205" font-size="11" fill="#166534" text-anchor="middle">History</text>
    <rect x="108" y="192" width="58" height="19" rx="9.5" fill="#dcfce7" stroke="#86efac"/>
    <text x="137" y="205" font-size="11" fill="#166534" text-anchor="middle">Places</text>
  </g>
  <g>
    <rect x="24" y="236" width="240" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="40" y="258" font-size="12.5" font-weight="600" fill="#0f172a">Picture C</text>
    <rect x="40" y="268" width="62" height="19" rx="9.5" fill="#dcfce7" stroke="#86efac"/>
    <text x="71" y="281" font-size="11" fill="#166534" text-anchor="middle">History</text>
    <rect x="108" y="268" width="58" height="19" rx="9.5" fill="#dcfce7" stroke="#86efac"/>
    <text x="137" y="281" font-size="11" fill="#166534" text-anchor="middle">Places</text>
  </g>
  <g>
    <rect x="24" y="312" width="240" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="40" y="334" font-size="12.5" font-weight="600" fill="#0f172a">Article D</text>
    <rect x="40" y="344" width="62" height="19" rx="9.5" fill="#dcfce7" stroke="#86efac"/>
    <text x="71" y="357" font-size="11" fill="#166534" text-anchor="middle">History</text>
  </g>

  <!-- arrows into sets -->
  <line x1="268" y1="114" x2="552" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="268" y1="190" x2="552" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="268" y1="266" x2="552" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="268" y1="342" x2="552" y2="336" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <!-- set boxes -->
  <rect x="556" y="112" width="340" height="140" rx="10" fill="#fef9c3" stroke="#facc15"/>
  <text x="576" y="140" font-size="13" font-weight="600" fill="#854d0e">Bucket set #7 &#8212; { History, Places }</text>
  <text x="576" y="164" font-size="12" fill="#854d0e">members: Article A, Article B, Picture C &#8230;</text>
  <text x="576" y="182" font-size="12" fill="#854d0e">plus every other item with exactly these buckets</text>
  <text x="576" y="210" font-size="12" font-weight="600" fill="#854d0e">precomputed counts: 2 articles &#183; 1 picture</text>

  <rect x="556" y="292" width="340" height="100" rx="10" fill="#fef9c3" stroke="#facc15"/>
  <text x="576" y="320" font-size="13" font-weight="600" fill="#854d0e">Bucket set #3 &#8212; { History }</text>
  <text x="576" y="344" font-size="12" fill="#854d0e">members: Article D &#8230;</text>
  <text x="576" y="368" font-size="12" font-weight="600" fill="#854d0e">precomputed counts: 1 article</text>

  <text x="20" y="410" font-size="11.5" fill="#64748b" font-style="italic">Rebuilt from scratch on every app start, right after import. ~120,000 items collapse into a few hundred sets &#8212; the feed reasons about sets, not items.</text>
  <text x="20" y="426" font-size="11.5" fill="#64748b" font-style="italic">Set numbers are temporary and internal; nothing outside the feed selection ever sees them.</text>
</svg>
