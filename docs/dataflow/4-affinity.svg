<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="919" height="419" fill="#ffffff" stroke="#e2e8f0" rx="8"/>
  <text x="20" y="34" font-size="16" font-weight="600" fill="#0f172a">From your activity to a per-set affinity score</text>

  <!-- signals -->
  <rect x="24" y="96" width="200" height="180" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="124" y="124" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Your signals</text>
  <rect x="48" y="140" width="152" height="26" rx="13" fill="#dcfce7" stroke="#86efac"/>
  <text x="124" y="157" font-size="12" fill="#166534" text-anchor="middle">Like&#8202;: +1</text>
  <rect x="48" y="174" width="152" height="26" rx="13" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="124" y="191" font-size="12" fill="#991b1b" text-anchor="middle">Dislike&#8202;: &#8722;1</text>
  <rect x="48" y="208" width="152" height="26" rx="13" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="124" y="225" font-size="12" fill="#1e40af" text-anchor="middle">Link click&#8202;: +0.5</text>
  <text x="124" y="258" font-size="11" fill="#64748b" text-anchor="middle">counted over items you saw</text>

  <line x1="228" y1="186" x2="276" y2="186" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <!-- per bucket -->
  <rect x="280" y="72" width="310" height="238" rx="10" fill="#dcfce7" stroke="#4ade80"/>
  <text x="435" y="100" font-size="13" font-weight="600" fill="#166534" text-anchor="middle">Score per bucket</text>
  <text x="435" y="122" font-size="12" fill="#166534" text-anchor="middle">(likes + &#189;&#183;clicks &#8722; dislikes) &#247; (seen + 5)</text>
  <line x1="300" y1="136" x2="570" y2="136" stroke="#86efac"/>
  <text x="300" y="160" font-size="12" fill="#166534">History &#8202;&#8212;&#8202; 15 seen, 6 likes, 2 clicks</text>
  <text x="570" y="160" font-size="12" font-weight="600" fill="#166534" text-anchor="end">0.35</text>
  <text x="300" y="184" font-size="12" fill="#166534">Sports &#8202;&#8212;&#8202; 15 seen, 6 dislikes</text>
  <text x="570" y="184" font-size="12" font-weight="600" fill="#166534" text-anchor="end">&#8722;0.30</text>
  <text x="300" y="208" font-size="12" fill="#166534">Arts &#8202;&#8212;&#8202; 4 seen, 1 like</text>
  <text x="570" y="208" font-size="12" font-weight="600" fill="#166534" text-anchor="end">0.11</text>
  <text x="300" y="232" font-size="12" fill="#166534">any bucket you never reacted to</text>
  <text x="570" y="232" font-size="12" font-weight="600" fill="#166534" text-anchor="end">0</text>
  <text x="300" y="264" font-size="11" fill="#15803d">the &#8220;+ 5&#8221; smoothing keeps one stray like from</text>
  <text x="300" y="278" font-size="11" fill="#15803d">swinging a barely-seen bucket &#183; scores clamp to &#177;2</text>

  <line x1="594" y1="186" x2="642" y2="186" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow4)"/>

  <!-- per set -->
  <rect x="646" y="72" width="250" height="238" rx="10" fill="#fef9c3" stroke="#facc15"/>
  <text x="771" y="100" font-size="13" font-weight="600" fill="#854d0e" text-anchor="middle">Score per bucket set</text>
  <text x="771" y="120" font-size="12" fill="#854d0e" text-anchor="middle">= average of its buckets</text>
  <line x1="666" y1="134" x2="876" y2="134" stroke="#fde047"/>
  <text x="666" y="160" font-size="12" fill="#854d0e">{ History, Places }</text>
  <text x="876" y="160" font-size="12" font-weight="600" fill="#854d0e" text-anchor="end">(0.35 + 0)/2 = 0.18</text>
  <text x="666" y="184" font-size="12" fill="#854d0e">{ Sports }</text>
  <text x="876" y="184" font-size="12" font-weight="600" fill="#854d0e" text-anchor="end">&#8722;0.30</text>
  <text x="666" y="208" font-size="12" fill="#854d0e">{ History, Sports }</text>
  <text x="876" y="208" font-size="12" font-weight="600" fill="#854d0e" text-anchor="end">&#8776; 0.03</text>
  <text x="666" y="240" font-size="11" fill="#a16207">a set mixing a liked and a disliked</text>
  <text x="666" y="254" font-size="11" fill="#a16207">bucket lands back near neutral</text>

  <text x="20" y="348" font-size="11.5" fill="#64748b" font-style="italic">Scores are recomputed from your history on every feed request &#8212; nothing is stored per bucket.</text>
  <text x="20" y="366" font-size="11.5" fill="#64748b" font-style="italic">New or anonymous users have no signals at all: every score is 0 and the feed stays plain random.</text>
</svg>
